apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-mcp
  namespace: kagenti-mcp-demo
  labels:
    app.kubernetes.io/name: weather-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp
          image: ghcr.io/rossoctl/examples/weather_tool@sha256:6fd5d0b68792e3ddfb769bb974eb155a9bd1619792f79908b8aa70dc030d496f
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8000"
            - name: UV_CACHE_DIR
              value: /app/.cache/uv
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: tmp
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weather
  namespace: kagenti-mcp-demo
  labels:
    app.kubernetes.io/name: weather-mcp
spec:
  selector:
    app.kubernetes.io/name: weather-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-mcp
  namespace: kagenti-mcp-demo
  labels:
    app.kubernetes.io/name: reservation-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reservation-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reservation-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp
          image: ghcr.io/rossoctl/examples/reservation_tool@sha256:b5fe4e947083d143e99fda2bde50cb99f8c70ed2d0a7c743ababca61cef22ecd
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8000"
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: UV_CACHE_DIR
              value: /app/.cache/uv
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: tmp
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reservation
  namespace: kagenti-mcp-demo
  labels:
    app.kubernetes.io/name: reservation-mcp
spec:
  selector:
    app.kubernetes.io/name: reservation-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
