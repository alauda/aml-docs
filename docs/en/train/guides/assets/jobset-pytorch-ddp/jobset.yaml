apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: torch-ddp
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - workers
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 2
          completions: 2
          completionMode: Indexed
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              containers:
                - name: trainer
                  image: alaudadockerhub/torch-distributed:v2.9.1-aml2
                  imagePullPolicy: IfNotPresent
                  workingDir: /workspace
                  command:
                    - /bin/bash
                    - -lc
                  args:
                    - >-
                      torchrun --nnodes=2 --nproc_per_node=1
                      --node_rank="${JOB_COMPLETION_INDEX}"
                      --master_addr="${MASTER_ADDR}"
                      --master_port="${MASTER_PORT}"
                      /workspace/train.py
                  env:
                    - name: MASTER_ADDR
                      value: torch-ddp-workers-0-0.torch-ddp
                    - name: MASTER_PORT
                      value: "29500"
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      cpu: "2"
                      memory: 2Gi
                  volumeMounts:
                    - name: training-code
                      mountPath: /workspace
                      readOnly: true
              volumes:
                - name: training-code
                  configMap:
                    name: torch-ddp-training
