apiVersion: apps/v1
kind: Deployment
metadata:
  name: generic-agent
  namespace: kagenti-mcp-demo
  labels:
    app.kubernetes.io/name: generic-agent
    protocol.kagenti.io/a2a: ""
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/rossoctl/examples/generic_agent@sha256:54409772e7f33595fcb6488b7f343c3f2b82a692a0edba1d1ceacebb13262b11
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: 0.0.0.0
            - name: UV_CACHE_DIR
              value: /app/.cache/uv
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-client-api-keys
                  key: generic-agent
            - name: MCP_URLS
              value: http://kagenti-mcp-envoy.envoy-gateway-system.svc.cluster.local/mcp?api-key=$(MCP_API_KEY)
            - name: MCP_TRANSPORT
              value: streamable_http
            - name: LLM_API_BASE
              valueFrom:
                secretKeyRef:
                  name: generic-agent-llm
                  key: api-base
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: generic-agent-llm
                  key: api-key
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: generic-agent-llm
                  key: model
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: tmp
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: generic-agent
  namespace: kagenti-mcp-demo
spec:
  selector:
    app.kubernetes.io/name: generic-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: agent.kagenti.dev/v1alpha1
kind: AgentRuntime
metadata:
  name: generic-agent
  namespace: kagenti-mcp-demo
spec:
  type: agent
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: generic-agent
