# =============================================================================
# GLM-5.2 (W4A8C8) · Prefill/Decode disaggregation · 1M context
# 8 × Atlas 800 A2 (64 × Ascend 910B3 64 GB) · KServe LLMInferenceService +
# InferNex-Bridge + hermes-router (EPP) + P→D proxy
#
#   Prefill: 4 nodes = one engine, DP4 × TP8 (one DP rank per node), EP32, DCP8
#   Decode:  4 nodes = one engine, DP4 × TP8 (one DP rank per node), EP32, DCP8
#   Every node is an HTTP endpoint (--data-parallel-hybrid-lb); the EPP picks one
#   prefill and one decode node per request and the proxy forwards P → D.
#   KV: MooncakeConnectorV1 (P → D) + AscendStoreConnector (shared mooncake KV pool,
#   48 GiB per engine worker process ≈ 3 TiB across the 64 workers).
#
# Apply order (see the GLM-5.2 page for the full procedure):
#   1. kubectl apply -f glm-5.2-w4a8c8-pd-4p4d-1m-llmisvc.yaml
#   2. kubectl -n demo patch infernexservice glm52-pd --type=merge \
#        --patch-file glm-5.2-w4a8c8-mooncake-master-patch.yaml   (re-apply after every step 1)
#   3. optional MaaS ingress: glm-5.2-w4a8c8-maas-route.yaml
#
# Differences from the manifest that was benchmarked (none changes engine flags):
#   - model.uri points at the public ModelCar; the benchmarked run mounted a node-local
#     copy of the same ModelScope weights (Eco-Tech/GLM-5.2-w4a8c8) via hostPath with the
#     storageInitializer disabled — see "ALT" below. The ModelCar path was NOT validated
#     for this model: all 8 pods pull ~326 GiB each and need ~377 GiB of node disk.
#   - fastokens is installed from PyPI (the run installed the same 0.3.4 wheel from a
#     node directory). If the install fails the engine still starts, without fastokens.
#   - Node pinning, the torch profiler, VLLM_SERVER_DEV_MODE and SYS_PTRACE (diagnostics
#     used during the run) are removed. Image references point at public registries with
#     the same digests that ran.
#
# Edit before applying: the namespace (demo), and the registry references if your nodes
# are air-gapped (the engine image alone is ~20 GB; the ModelCar is ~326 GiB).
# =============================================================================
---
# KServe looks up these two presets whenever spec.worker / spec.prefill.worker is used
# with data parallelism; without them the LLMInferenceService never reconciles.
# They are intentionally empty: the full container spec lives in the LLMInferenceService.
# Do not install the stock KServe ones — their probes target port 8001.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: kserve-config-llm-prefill-worker-data-parallel
  namespace: demo
spec:
  prefill:
    template:
      containers:
        - name: main
    worker:
      containers:
        - name: main
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: kserve-config-llm-decode-worker-data-parallel
  namespace: demo
spec:
  template:
    containers:
      - name: main
  worker:
    containers:
      - name: main
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: glm52-pd
  namespace: demo
  labels:
    infernex.io/runtime: "true"
  annotations:
    # The P→D proxy is deployed below (the Bridge-managed one carries no pdRole label,
    # so the EPP cannot address it). cache-indexer is not used with LWS + multi-DP.
    infernex.io/disabled-components: "proxy-server,pd-orchestrator,eagle-eye,cache-indexer"
spec:
  model:
    # ModelCar built from ModelScope Eco-Tech/GLM-5.2-w4a8c8; the storageInitializer
    # pulls it to /mnt/models in every engine pod.
    # ALT (what the benchmark ran): pre-stage the weights on every node, set
    #   storageInitializer.enabled: false, and add a `model` hostPath/PVC volume mounted
    #   read-only at /mnt/models in both templates.
    uri: oci://docker.io/alaudadockerhub/modelcar-glm-5.2-w4a8c8:v0.1.0
    name: glm-52

  # ====================== decode: 4 nodes, 1 DP rank each ======================
  replicas: 1
  parallelism: { data: 4, dataLocal: 1, tensor: 8, expert: true }
  labels:
    openfuyao.com/pdGroupID: glm52-pd
    openfuyao.com/pdRole: decode
    # Put the worker pods in the InferencePool as well: every node is an endpoint.
    # KServe only labels the leader with kserve.io/component=workload when a leader
    # template exists, and the Bridge always creates one.
    kserve.io/component: workload

  template: &decodeTemplate
    tolerations: [{ operator: Exists }]
    hostIPC: true
    initContainers:
      - &mooncakeInit
        name: mooncake-config-init
        image: &image quay.io/ascend/vllm-ascend@sha256:6c183dfa86cf13ea5fa54ac8f0bcf7316c5b91e7f9774c26dc282dfd94da8ef9  # v0.23.0-openeuler, arm64
        command: ["sh", "-c"]
        args:
          - |
            set -e
            # global_segment_size = 48 GiB per worker process (96 GiB failed to register
            # NIC memory on some hosts).
            printf '{"local_hostname":"%s","metadata_server":"redis://redis-service:6379","master_server_address":"mooncake-master-service:30089","device_name":"","protocol":"ascend","global_segment_size":51539607552,"use_ascend_direct":true}' "$POD_IP" > /app/mooncake.json
            cat /app/mooncake.json
        env:
          - name: POD_IP
            valueFrom: { fieldRef: { fieldPath: status.podIP } }
        volumeMounts:
          - { name: mooncake-config, mountPath: /app }
    containers:
      - name: main
        image: *image
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            START_RANK=$(( ${LWS_WORKER_INDEX:-0} * 1 ))
            # Wait for the leader's DNS record so a worker does not start early and
            # force the whole group to be recreated.
            for i in $(seq 120); do getent hosts "$LWS_LEADER_ADDRESS" >/dev/null && break; sleep 5; done
            # fastokens: a faster tokenizer for the API server. vLLM-Ascend v0.23.0 images do
            # not ship it; without it a 1M-token request spends ~4 s tokenizing on each side.
            # Air-gapped: set FASTOKENS_SPEC to a wheel path you mount into the pod.
            if pip install --no-deps -q --target /tmp/fastokens "${FASTOKENS_SPEC:-fastokens==0.3.4}"; then
              export PYTHONPATH=/tmp/fastokens${PYTHONPATH:+:$PYTHONPATH} VLLM_USE_FASTOKENS=1
            else
              echo "[glm52-pd] WARNING: fastokens not installed; long-context TTFT will be higher" >&2
            fi
            exec vllm serve /mnt/models \
              --served-model-name glm-52 \
              --host 0.0.0.0 --port 8000 \
              --seed 1024 \
              --trust-remote-code \
              --max-model-len 1048576 \
              --api-server-count 1 \
              --tensor-parallel-size 8 \
              --pipeline-parallel-size 1 \
              --data-parallel-size 4 \
              --data-parallel-size-local 1 \
              --data-parallel-start-rank ${START_RANK} \
              --data-parallel-address ${LWS_LEADER_ADDRESS} \
              --data-parallel-rpc-port 16600 \
              --data-parallel-hybrid-lb \
              --prefill-context-parallel-size 1 \
              --decode-context-parallel-size 8 \
              --block-size 128 \
              --cp-kv-cache-interleave-size 128 \
              --quantization ascend \
              --enable-expert-parallel \
              --safetensors-load-strategy prefetch \
              --enable-prefix-caching \
              --prefix-caching-hash-algo sha256_cbor \
              --enable-auto-tool-choice \
              --tool-call-parser glm47 \
              --reasoning-parser glm45 \
              --max-num-batched-tokens 192 \
              --gpu-memory-utilization 0.88 \
              --max-num-seqs 32 \
              --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
              --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": true}, "multistream_overlap_shared_expert": true, "enable_sparse_li_c8": true, "enable_cpu_binding": true, "recompute_scheduler_enable": true}' \
              --speculative-config '{"num_speculative_tokens": 5, "method": "deepseek_mtp", "enforce_eager": true}' \
              --kv-transfer-config '{"kv_connector": "MultiConnector", "kv_role": "kv_consumer", "kv_load_failure_policy": "recompute", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_consumer", "kv_port": "30100", "kv_connector_extra_config": {"use_ascend_direct": true, "prefill": {"dp_size": 4, "tp_size": 8}, "decode": {"dp_size": 4, "tp_size": 8}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_consumer", "kv_connector_extra_config": {"lookup_rpc_port": "0", "load_async": true, "backend": "mooncake"}}]}}'
        env: &env
          # With all capabilities dropped root cannot write /root; Triton needs ~/.triton.
          - { name: HOME, value: /home }
          - { name: MOONCAKE_CONFIG_PATH, value: /app/mooncake.json }
          # vLLM-Ascend v0.23.0 GLM-5.2 1M reference values
          - { name: VLLM_ASCEND_ENABLE_NZ, value: "1" }
          - { name: HCCL_OP_EXPANSION_MODE, value: AIV }
          - { name: OMP_PROC_BIND, value: "false" }
          - { name: OMP_NUM_THREADS, value: "20" }
          - { name: HCCL_BUFFSIZE, value: "768" }
          - { name: HCCL_TRANSFER_TIMEOUT, value: "600" }
          - { name: HCCL_EXEC_TIMEOUT, value: "3600" }
          - { name: HCCL_CONNECT_TIMEOUT, value: "3600" }
          - { name: PYTORCH_NPU_ALLOC_CONF, value: "expandable_segments:True" }
          - { name: VLLM_WORKER_MULTIPROC_METHOD, value: spawn }
          - { name: TASK_QUEUE_ENABLE, value: "1" }
          - { name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT, value: "480" }
          # Required on A2: HCCS cannot reach host memory, so KV-pool transfers must use
          # the device RoCE path.
          - { name: HCCL_INTRA_ROCE_ENABLE, value: "1" }
          - { name: ACL_OP_INIT_MODE, value: "1" }
          - { name: PYTHONHASHSEED, value: "0" }
          - { name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES, value: "1" }
          - { name: VLLM_RPC_TIMEOUT, value: "360000" }
          - { name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS, value: "30000" }
          # Multi-node 1M start-up is slow.
          - { name: MF_GROUP_JOIN_MAX_TIMEOUT, value: "1200" }
          - { name: VLLM_ENGINE_READY_TIMEOUT_S, value: "3600" }
          - name: POD_IP
            valueFrom: { fieldRef: { fieldPath: status.podIP } }
          - name: HCCL_IF_IP
            valueFrom: { fieldRef: { fieldPath: status.podIP } }
          - name: VLLM_HOST_IP
            valueFrom: { fieldRef: { fieldPath: status.podIP } }
          - { name: HCCL_SOCKET_IFNAME, value: eth0 }
          - { name: GLOO_SOCKET_IFNAME, value: eth0 }
          - { name: TP_SOCKET_IFNAME, value: eth0 }
        # The proxy finds the engine port by these names (decode-port / prefill-port).
        ports:
          - { name: decode-port, containerPort: 8000, protocol: TCP }
        resources: &resources
          limits: { huawei.com/Ascend910: "8", cpu: "96", memory: 640Gi }
          requests: { huawei.com/Ascend910: "8", cpu: "48", memory: 256Gi }
        securityContext: &securityContext
          # CANN and the driver need root.
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }
        # Weight load + graph build for 1M takes about 20 minutes.
        startupProbe: &startupProbe
          failureThreshold: 180
          periodSeconds: 20
          httpGet: { path: /health, port: 8000 }
        volumeMounts: &volumeMounts
          - { name: home, mountPath: /home }
          - { name: mooncake-config, mountPath: /app, readOnly: true }
          - { name: shm, mountPath: /dev/shm }
          - { name: ascend-driver-lib64, mountPath: /usr/local/Ascend/driver/lib64, readOnly: true }
          - { name: ascend-driver-version, mountPath: /usr/local/Ascend/driver/version.info, readOnly: true }
          - { name: ascend-hccn-tool, mountPath: /usr/local/Ascend/driver/tools/hccn_tool, readOnly: true }
          - { name: ascend-hccn-conf, mountPath: /etc/hccn.conf, readOnly: true }
          - { name: ascend-dcmi, mountPath: /usr/local/dcmi, readOnly: true }
          - { name: ascend-npu-smi, mountPath: /usr/local/bin/npu-smi, readOnly: true }
          - { name: ascend-install-info, mountPath: /etc/ascend_install.info, readOnly: true }
          # ALT (pre-staged weights): - { name: model, mountPath: /mnt/models, readOnly: true }
    volumes: &volumes
      - name: home
        emptyDir: {}
      - name: mooncake-config
        emptyDir: {}
      - name: shm
        emptyDir: { medium: Memory, sizeLimit: 64Gi }
      - { name: ascend-driver-lib64, hostPath: { path: /usr/local/Ascend/driver/lib64, type: Directory } }
      - { name: ascend-driver-version, hostPath: { path: /usr/local/Ascend/driver/version.info, type: File } }
      - { name: ascend-hccn-tool, hostPath: { path: /usr/local/Ascend/driver/tools/hccn_tool, type: File } }
      - { name: ascend-hccn-conf, hostPath: { path: /etc/hccn.conf, type: File } }
      - { name: ascend-dcmi, hostPath: { path: /usr/local/dcmi, type: Directory } }
      - { name: ascend-npu-smi, hostPath: { path: /usr/local/bin/npu-smi, type: File } }
      - { name: ascend-install-info, hostPath: { path: /etc/ascend_install.info, type: File } }
      # ALT (pre-staged weights): - { name: model, hostPath: { path: <weights-dir>, type: Directory } }

  # Decode workers: same container; the DP rank comes from LWS_WORKER_INDEX.
  worker:
    <<: *decodeTemplate

  # ====================== prefill: 4 nodes, 1 DP rank each ======================
  prefill:
    replicas: 1
    parallelism: { data: 4, dataLocal: 1, tensor: 8, expert: true }
    labels:
      openfuyao.com/pdGroupID: glm52-pd
      openfuyao.com/pdRole: prefill
      kserve.io/component: workload
    template: &prefillTemplate
      tolerations: [{ operator: Exists }]
      hostIPC: true
      initContainers:
        - *mooncakeInit
      containers:
        - name: main
          image: *image
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              START_RANK=$(( ${LWS_WORKER_INDEX:-0} * 1 ))
              for i in $(seq 120); do getent hosts "$LWS_LEADER_ADDRESS" >/dev/null && break; sleep 5; done
              if pip install --no-deps -q --target /tmp/fastokens "${FASTOKENS_SPEC:-fastokens==0.3.4}"; then
                export PYTHONPATH=/tmp/fastokens${PYTHONPATH:+:$PYTHONPATH} VLLM_USE_FASTOKENS=1
              else
                echo "[glm52-pd] WARNING: fastokens not installed; long-context TTFT will be higher" >&2
              fi
              # --gpu-memory-utilization 0.88 leaves temporary memory for deep-context prefill:
              # at 0.93 / 0.90 prefill slowed sharply past ~350k / ~800k tokens.
              exec vllm serve /mnt/models \
                --served-model-name glm-52 \
                --host 0.0.0.0 --port 8000 \
                --seed 1024 \
                --trust-remote-code \
                --max-model-len 1048576 \
                --api-server-count 1 \
                --tensor-parallel-size 8 \
                --pipeline-parallel-size 1 \
                --data-parallel-size 4 \
                --data-parallel-size-local 1 \
                --data-parallel-start-rank ${START_RANK} \
                --data-parallel-address ${LWS_LEADER_ADDRESS} \
                --data-parallel-rpc-port 16591 \
                --data-parallel-hybrid-lb \
                --prefill-context-parallel-size 1 \
                --decode-context-parallel-size 8 \
                --block-size 128 \
                --cp-kv-cache-interleave-size 128 \
                --quantization ascend \
                --enable-expert-parallel \
                --safetensors-load-strategy prefetch \
                --enable-prefix-caching \
                --prefix-caching-hash-algo sha256_cbor \
                --enable-auto-tool-choice \
                --tool-call-parser glm47 \
                --reasoning-parser glm45 \
                --max-num-batched-tokens 8192 \
                --gpu-memory-utilization 0.88 \
                --max-num-seqs 8 \
                --enforce-eager \
                --additional-config '{"enable_flashcomm1": true, "enable_dsa_cp": true, "ascend_compilation_config": {"enable_npugraph_ex": true}, "multistream_overlap_shared_expert": true, "enable_sparse_li_c8": true, "enable_cpu_binding": true}' \
                --speculative-config '{"num_speculative_tokens": 1, "method": "deepseek_mtp", "enforce_eager": true}' \
                --kv-transfer-config '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_load_failure_policy": "recompute", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"use_ascend_direct": true, "prefill": {"dp_size": 4, "tp_size": 8}, "decode": {"dp_size": 4, "tp_size": 8}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"lookup_rpc_port": "0", "backend": "mooncake"}}]}}'
          env: *env
          ports:
            - { name: prefill-port, containerPort: 8000, protocol: TCP }
          resources: *resources
          securityContext: *securityContext
          startupProbe: *startupProbe
          volumeMounts: *volumeMounts
      volumes: *volumes
    worker:
      <<: *prefillTemplate

  # ====================== router: hermes-router (EPP) ======================
  router:
    gateway: {}
    route: {}
    scheduler:
      pool:
        spec:
          # The 8 engine pods and the proxy all carry pdGroupID. KServe adds the
          # app.kubernetes.io/name, app.kubernetes.io/part-of and
          # kserve.io/component=workload selectors from its preset.
          selector:
            matchLabels:
              openfuyao.com/pdGroupID: glm52-pd
          targetPorts:
            - number: 8000
          endpointPickerRef:
            group: ""
            kind: Service
            name: glm52-pd-epp-service
            port: { number: 9002 }
            # FailOpen would hand a request to an arbitrary engine pod when the EPP errors;
            # landing on a prefill pod it hangs. FailClose returns an error instead.
            failureMode: FailClose
      template:
        tolerations: [{ operator: Exists }]
        containers:
          - name: main
            image: build-harbor.alauda.cn/3rdparty/openfuyao/hermes-router@sha256:8cb00e74aeefde6cddb1b78d8d5ecfdf0a55c63e152eaad07f81f7610faa9eda  # 26.6.0
            imagePullPolicy: IfNotPresent
            args:
              - --pool-name
              - glm52-pd-inference-pool
              - --pool-namespace
              - demo
              - --pool-group
              - inference.networking.k8s.io
              - --zap-encoder
              - json
              - --v
              - "2"
              - --metrics-endpoint-auth
              - "false"
              - --tracing
              - "false"
              - --config-text
              # The chart's kv-cache-aware + pd plugin chain without the tokenizer and
              # prefix-cache producer (no tokenizer sidecar, no cache-indexer here).
              # pd-kvcache-aware-scorer picks the decode node with the lowest
              #   2 × in-flight + 1 × KV usage + 1 × queue  (in-flight and queue divided by their
              #   maximum over the 4 nodes, KV usage as is);
              # in-flight is the request size booked by request-lifecycle-tracker until the
              # response stream ends. With only a prefix weight and no prefix data, prefill
              # nodes tie and are picked at random.
              # Use min-score-picker: in hermes 26.6.0 `random-picker` and `max-score-picker`
              # are overridden by same-named upstream plugins that never pick a P/D pair.
              - |
                apiVersion: inference.networking.x-k8s.io/v1alpha1
                kind: EndpointPickerConfig
                plugins:
                - type: metrics-data-source
                  parameters: { scheme: http, path: /metrics, insecureSkipVerify: true }
                - type: core-metrics-extractor
                - type: pd-group-producer
                  parameters:
                    pdLabelName: openfuyao.com/pdRole
                    pdGroupLabelName: openfuyao.com/pdGroupID
                    prefillValue: prefill
                    decodeValue: decode
                    leaderValue: leader
                - type: request-lifecycle-tracker
                  parameters: { storeName: hermes-inflight }
                - type: inflight-data-producer
                  parameters: { storeName: hermes-inflight }
                - type: pd-group-filter
                - type: pd-kvcache-aware-scorer
                  parameters:
                    prefillPrefixWeight: 1
                    decodeInflightWeight: 2
                    decodeKVUsageWeight: 1
                    decodeQueueWeight: 1
                - type: min-score-picker
                - type: pd-header-handler
                schedulingProfiles:
                - name: default
                  plugins:
                  - pluginRef: pd-group-producer
                  - pluginRef: request-lifecycle-tracker
                  - pluginRef: inflight-data-producer
                  - pluginRef: pd-group-filter
                  - pluginRef: pd-kvcache-aware-scorer
                  - pluginRef: min-score-picker
                  - pluginRef: pd-header-handler
            ports:
              - { containerPort: 9002, name: grpc, protocol: TCP }
              - { containerPort: 9003, name: grpc-health, protocol: TCP }
              - { containerPort: 9090, name: metrics, protocol: TCP }
            livenessProbe:
              grpc: { port: 9003, service: inference-extension }
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 3
            readinessProbe:
              grpc: { port: 9003, service: inference-extension }
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 3
            resources:
              requests: { cpu: 500m, memory: 1Gi }
              limits: { cpu: "8", memory: 64Gi }
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile: { type: RuntimeDefault }
---
# ====================== P→D proxy (InferNex chart: vllm-proxy-rbac.yaml) ======================
# The proxy discovers prefill / decode pods by label, so it needs to read pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glm52-pd-proxy
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glm52-pd-proxy
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glm52-pd-proxy
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: glm52-pd-proxy
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: glm52-pd-proxy
---
# ====================== P→D proxy (InferNex chart: proxy-server-deployment.yaml) ======================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm52-pd-proxy
  namespace: demo
  labels: { app: glm52-pd-proxy }
spec:
  replicas: 1
  selector:
    matchLabels: { app: glm52-pd-proxy }
  template:
    metadata:
      labels:
        app: glm52-pd-proxy
        # The EPP finds the group entry point by pdRole=leader.
        app.kubernetes.io/component: proxy-server
        openfuyao.com/pdRole: leader
        openfuyao.com/pdGroupID: glm52-pd
        # Selected into the InferencePool (KServe merges these three into its selector).
        app.kubernetes.io/name: glm52-pd
        app.kubernetes.io/part-of: llminferenceservice
        kserve.io/component: workload
    spec:
      serviceAccountName: glm52-pd-proxy
      tolerations: [{ operator: Exists }]
      containers:
        - name: proxy-server
          image: build-harbor.alauda.cn/3rdparty/openfuyao/proxy-server@sha256:65782645ae423a7c3376feb39f9bcde4858f3c16f3df3eb57ee5de92e214396e  # 26.6.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          # Two patches are applied at start-up (check the log lines after an image change):
          #  1. The proxy sets max_tokens=1 for the prefill hop but keeps
          #     max_completion_tokens, which vLLM prefers. Clients that send it (aiperf,
          #     recent OpenAI SDKs) would make prefill generate the whole answer.
          #  2. The load heap keeps stale (load, node) entries, so after a burst every
          #     request goes to the node with the lowest IP. Drop stale heap heads; this
          #     one fails the container if the code it targets has changed.
          args:
            - |
              set -e
              sed -i 's/^    body\["max_tokens"\] = 1$/    body["max_tokens"] = 1\n    body.pop("max_completion_tokens", None)/' k8s_proxy_server_example.py
              grep -n -A1 'body\["max_tokens"\] = 1' k8s_proxy_server_example.py
              python3 - <<'PY'
              p = "k8s_proxy_server_example.py"
              s = open(p).read()
              old = ("            _, key = self._heap[0]\n"
                     "            if key in self.servers:\n"
                     "                return\n")
              new = ("            prio, key = self._heap[0]\n"
                     "            server = self.servers.get(key)\n"
                     "            if server is not None and prio == self._priority_for(server):\n"
                     "                return\n")
              assert s.count(old) == 1, "proxy heap patch: pattern not found"
              open(p, "w").write(s.replace(old, new))
              print("proxy heap patch applied")
              PY
              # The engine container is named `main` in KServe pods (the chart says
              # prefill-engine / decode-engine); the port is then found by name.
              exec python3 k8s_proxy_server_example.py \
                --host 0.0.0.0 \
                --prefiller-label "openfuyao.com/pdRole=prefill,openfuyao.com/pdGroupID=glm52-pd" \
                --decoder-label "openfuyao.com/pdRole=decode,openfuyao.com/pdGroupID=glm52-pd" \
                --prefiller-container main \
                --decoder-container main \
                --prefiller-port-name prefill-port \
                --decoder-port-name decode-port \
                --namespace demo \
                --port 8000 \
                --discovery-interval 10
          ports:
            - { name: proxy-port, containerPort: 8000, protocol: TCP }
          # 1M request bodies are 2–4 MB each; the proxy is a single event loop.
          resources:
            requests: { cpu: "4", memory: 8Gi }
            limits: { cpu: "16", memory: 32Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: glm52-pd-proxy
  namespace: demo
spec:
  selector: { app: glm52-pd-proxy }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
