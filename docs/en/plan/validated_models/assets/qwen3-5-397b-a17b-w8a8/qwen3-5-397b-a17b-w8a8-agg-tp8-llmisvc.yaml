apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    infernex.io/disabled-components: mooncake,cache-indexer,pd-orchestrator,eagle-eye
  labels:
    infernex.io/runtime: 'true'
    model: qwen35-397b-w8a8
    validation.alauda.cn/run: 2026-09-03-guian
  name: qwen35-397b-w8a8-agg
  namespace: <your-namespace>
spec:
  model:
    name: qwen3.5-397b-a17b-w8a8
    uri: pvc://<weights-pvc-node-0>/
  parallelism:
    data: 1
    dataLocal: 1
    tensor: 8
  router:
    gateway: {}
    route: {}
    scheduler:
      pool:
        spec:
          endpointPickerRef:
            failureMode: FailOpen
            group: ''
            kind: Service
            name: qwen35-397b-w8a8-agg-epp-service
            port:
              number: 9002
          selector:
            matchLabels:
              app.kubernetes.io/name: qwen35-397b-w8a8-agg
              app.kubernetes.io/part-of: llminferenceservice
              kserve.io/component: workload
              leaderworkerset.sigs.k8s.io/worker-index: '0'
          targetPorts:
          - number: 8000
      template:
        containers:
        - args:
          - --pool-name
          - qwen35-397b-w8a8-agg-inference-pool
          - --pool-namespace
          - zgsu-ns1
          - --pool-group
          - inference.networking.k8s.io
          - --zap-encoder
          - json
          - --v
          - '1'
          - --tracing
          - 'false'
          - --metrics-endpoint-auth
          - 'false'
          - --refresh-metrics-interval=60s
          - --config-text
          - "apiVersion: inference.networking.x-k8s.io/v1alpha1\nkind: EndpointPickerConfig\nplugins:\n- type: metrics-data-source\n  parameters: { scheme: \"http\", path: \"/metrics\", insecureSkipVerify: true }\n- type: core-metrics-extractor\n- type: random-picker\nschedulingProfiles:\n- name: default\n  plugins:\n  - pluginRef: random-picker"
          image: <your-registry>/3rdparty/openfuyao/hermes-router:26.6.0-rc.3
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            grpc:
              port: 9003
              service: liveness
            periodSeconds: 10
            timeoutSeconds: 5
          name: main
          ports:
          - containerPort: 9002
            name: grpc
            protocol: TCP
          - containerPort: 9003
            name: grpc-health
            protocol: TCP
          - containerPort: 9090
            name: metrics
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            grpc:
              port: 9003
              service: readiness
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            grpc:
              port: 9003
              service: liveness
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
          - mountPath: /etc/ssl/certs
            name: tls-certs
            readOnly: true
        dnsPolicy: ClusterFirst
        nodeSelector:
          kubernetes.io/hostname: <node-0>
        restartPolicy: Always
        serviceAccountName: qwen35-397b-w8a8-agg-epp-sa
        terminationGracePeriodSeconds: 30
        tolerations:
        - operator: Exists
        volumes:
        - name: tls-certs
          secret:
            secretName: '{{ ChildName .ObjectMeta.Name `-kserve-self-signed-certs` }}'
  storageInitializer:
    enabled: false
  template:
    containers:
    - args:
      - "set +e\nsource /usr/local/Ascend/ascend-toolkit/set_env.sh 2>/dev/null || true\nsource /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true\necho \"[q35-8card] HCCL_IF_IP=${HCCL_IF_IP} 单机 8 卡，无 DP、无 LWS leader 等待\"\nexec vllm serve /mnt/models \\\n  --host 0.0.0.0 --port 8000 \\\n  --served-model-name qwen3.5-397b-a17b-w8a8 \\\n  --seed 1024 \\\n  --trust-remote-code \\\n  --api-server-count 1 \\\n  --tensor-parallel-size 8 \\\n  --enable-expert-parallel \\\n  --quantization ascend \\\n  --reasoning-parser qwen3 \\\n  --tool-call-parser qwen3_xml \\\n  --enable-auto-tool-choice \\\n  --max-model-len 65536 \\\n  --max-num-batched-tokens 4096 \\\n  --max-num-seqs 16 \\\n  --gpu-memory-utilization 0.97 \\\n  --model-loader-extra-config '{\"enable_multithread_load\":true,\"num_threads\":128}' \\\n  --async-scheduling \\\n  --enable-prefix-caching \\\n  --speculative-config '{\"method\":\"qwen3_5_mtp\",\"num_speculative_tokens\":1}' \\\n  --compilation-config '{\"cudagraph_mode\":\"FULL_DECODE_ONLY\"}' \\\n  --additional-config '{\"enable_cpu_binding\":true}'"
      command:
      - /bin/bash
      - -c
      env:
      - name: HOME
        value: /home
      - name: VLLM_LOGGING_LEVEL
        value: INFO
      - name: HF_HUB_OFFLINE
        value: '1'
      - name: TRANSFORMERS_OFFLINE
        value: '1'
      - name: PYTHONHASHSEED
        value: '0'
      - name: HCCL_OP_EXPANSION_MODE
        value: AIV
      - name: HCCL_BUFFSIZE
        value: '512'
      - name: VLLM_ASCEND_ENABLE_FLASHCOMM1
        value: '1'
      - name: HCCL_INTRA_ROCE_ENABLE
        value: '1'
      - name: GLOO_SOCKET_IFNAME
        value: eth0
      - name: TP_SOCKET_IFNAME
        value: eth0
      - name: HCCL_SOCKET_IFNAME
        value: eth0
      - name: LD_PRELOAD
        value: /usr/lib64/libjemalloc.so.2
      - name: VLLM_RPC_TIMEOUT
        value: '360000'
      - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
        value: '3000'
      - name: HCCL_EXEC_TIMEOUT
        value: '7200'
      - name: HCCL_CONNECT_TIMEOUT
        value: '7200'
      - name: ASCEND_CONNECT_TIMEOUT
        value: '10000'
      - name: ASCEND_TRANSFER_TIMEOUT
        value: '10000'
      - name: OMP_PROC_BIND
        value: 'false'
      - name: OMP_NUM_THREADS
        value: '1'
      - name: PYTORCH_NPU_ALLOC_CONF
        value: expandable_segments:True
      - name: ACL_OP_INIT_MODE
        value: '1'
      - name: TASK_QUEUE_ENABLE
        value: '1'
      - name: CPU_AFFINITY_CONF
        value: '1'
      - name: VLLM_ENGINE_READY_TIMEOUT_S
        value: '3600'
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: HCCL_IF_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_SERVER_DEV_MODE
        value: '1'
      image: <your-registry>/mlops/vllm-ascend@sha256:6c183dfa86cf13ea5fa54ac8f0bcf7316c5b91e7f9774c26dc282dfd94da8ef9
      imagePullPolicy: IfNotPresent
      livenessProbe:
        failureThreshold: 8
        httpGet:
          path: /health
          port: http
        periodSeconds: 15
        timeoutSeconds: 10
      name: main
      ports:
      - containerPort: 8000
        name: http
        protocol: TCP
      readinessProbe:
        failureThreshold: 3
        httpGet:
          path: /health
          port: http
        periodSeconds: 10
      resources:
        limits:
          cpu: '48'
          huawei.com/Ascend910: '8'
          memory: 480Gi
        requests:
          cpu: '16'
          huawei.com/Ascend910: '8'
          memory: 96Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      startupProbe:
        failureThreshold: 160
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
      volumeMounts:
      - mountPath: /mnt/models
        name: model
        readOnly: true
      - mountPath: /dev/shm
        name: shm
    hostIPC: true
    nodeSelector:
      kubernetes.io/hostname: <node-0>
    terminationGracePeriodSeconds: 30
    tolerations:
    - operator: Exists
    volumes:
    - name: model
      persistentVolumeClaim:
        claimName: <weights-pvc-node-0>
    - emptyDir:
        medium: Memory
        sizeLimit: 32Gi
      name: shm
